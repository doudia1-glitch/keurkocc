<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche de Place - Institution Mbour</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <nav class="bg-white border-b p-4 shadow-sm">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-blue-600 font-bold">← Retour</a>
            <span class="font-semibold text-slate-700">Portail Examen 2026</span>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center px-4 py-10">
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100 w-full max-w-md">
            <h2 class="text-2xl font-extrabold text-slate-900 mb-2 text-center">Trouver ma place</h2>
            <p class="text-slate-500 text-center mb-8 text-sm">Entrez vos informations pour consulter votre salle.</p>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Matricule</label>
                    <input type="text" id="matricule" placeholder="Ex: 2026-EM-001" 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Date de naissance</label>
                    <input type="date" id="dob" 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button onclick="chercherEleve()" 
                    class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-200">
                    Vérifier ma place
                </button>
            </div>

            <div id="resultat" class="mt-8 hidden p-6 rounded-2xl border-2 border-dashed">
                </div>
        </div>
    </main>

    <script>
        // Initialisation de Supabase
        const supabaseUrl = 'https://mrxgctgmbyugcbuzpfzq.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yeGdjdGdtYnl1Z2NidXpwZnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzg3NTQsImV4cCI6MjA5MjY1NDc1NH0.iW-4WmMRnsE9pF9k30il2_Ee0iNdHqmYoXHllw4qkGk';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function chercherEleve() {
            const mat = document.getElementById('matricule').value;
            const birth = document.getElementById('dob').value;
            const resDiv = document.getElementById('resultat');

            if(!mat || !birth) {
                alert("Veuillez remplir tous les champs.");
                return;
            }

            // Recherche dans Supabase
            const { data, error } = await _supabase
                .from('eleves')
                .select('*')
                .eq('matricule', mat.trim())
                .eq('date_naissance', birth)
                .single();

            resDiv.classList.remove('hidden', 'bg-green-50', 'border-green-200', 'bg-red-50', 'border-red-200');

            if (data) {
                resDiv.classList.add('bg-green-50', 'border-green-200');
                resDiv.innerHTML = `
                    <p class="text-green-800 text-sm font-bold uppercase tracking-wider mb-2 text-center underline">Informations trouvées</p>
                    <p class="text-slate-900 font-bold text-lg mb-1">${data.nom_complet}</p>
                    <div class="flex justify-between mt-4 text-slate-700">
                        <span>Salle : <strong class="text-blue-600">${data.salle || 'N/A'}</strong></span>
                        <span>Table : <strong class="text-blue-600">${data.numero_table}</strong></span>
                    </div>
                `;
            } else {
                resDiv.classList.add('bg-red-50', 'border-red-200');
                resDiv.innerHTML = `<p class="text-red-700 text-center font-medium">Aucun élève trouvé avec ces informations.</p>`;
            }
        }
    </script>
</body>
</html>
