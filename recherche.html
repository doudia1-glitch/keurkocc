<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche de Place - Institution Mbour</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

    <nav class="bg-white border-b p-4 shadow-sm">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-blue-600 font-bold hover:underline">← Retour</a>
            <span class="font-semibold text-slate-700">Portail Examen 2026</span>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center px-4 py-10">
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100 w-full max-w-md">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-extrabold text-slate-900 mb-2">Trouver ma place</h2>
                <p class="text-slate-500 text-sm">Vérification par identité et naissance.</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nom complet (Prénom et Nom)</label>
                    <input type="text" id="nom_complet" placeholder="Ex: Moussa Diop" 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Date de naissance</label>
                    <input type="date" id="dob" 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                </div>
                <button onclick="chercherEleve()" 
                    class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 active:scale-95">
                    Rechercher
                </button>
            </div>

            <div id="resultat" class="mt-8 hidden p-6 rounded-2xl border-2 border-dashed animate-pulse">
                </div>
        </div>
    </main>

    <script>
        const supabaseUrl = 'https://mrxgctgmbyugcbuzpfzq.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yeGdjdGdtYnl1Z2NidXpwZnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzg3NTQsImV4cCI6MjA5MjY1NDc1NH0.iW-4WmMRnsE9pF9k30il2_Ee0iNdHqmYoXHllw4qkGk';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function chercherEleve() {
            const nom = document.getElementById('nom_complet').value;
            const birth = document.getElementById('dob').value;
            const resDiv = document.getElementById('resultat');

            if(!nom || !birth) {
                alert("Veuillez remplir tous les champs.");
                return;
            }

            resDiv.classList.add('hidden');
            
            // Requête Supabase avec filtres Nom et Date
            const { data, error } = await _supabase
                .from('eleves')
                .select('*')
                .ilike('nom_complet', nom.trim()) // ilike ignore les majuscules/minuscules
                .eq('date_naissance', birth)
                .single();

            resDiv.classList.remove('hidden', 'animate-pulse', 'bg-green-50', 'border-green-200', 'bg-red-50', 'border-red-200');

            if (data) {
                resDiv.classList.add('bg-green-50', 'border-green-200');
                resDiv.innerHTML = `
                    <p class="text-green-800 text-xs font-black uppercase tracking-widest mb-3 text-center">Fiche Élève</p>
                    <p class="text-slate-900 font-bold text-xl mb-1 text-center">${data.nom_complet}</p>
                    <p class="text-slate-500 text-sm text-center mb-4 border-b pb-4 italic">${data.classe || 'Classe non définie'}</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="text-center">
                            <p class="text-xs text-slate-400 uppercase">Salle</p>
                            <p class="text-2xl font-black text-blue-600">${data.salle || '---'}</p>
                        </div>
                        <div class="text-center">
                            <p class="text-xs text-slate-400 uppercase">Table No</p>
                            <p class="text-2xl font-black text-blue-600">${data.numero_table}</p>
                        </div>
                    </div>
                `;
            } else {
                resDiv.classList.add('bg-red-50', 'border-red-200');
                resDiv.innerHTML = `<p class="text-red-700 text-center font-semibold">Aucun élève trouvé. Vérifiez l'orthographe exacte et la date.</p>`;
            }
        }
    </script>
</body>
</html>
